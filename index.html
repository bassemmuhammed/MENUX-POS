<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENUX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <meta name="theme-color" content="#1a0533">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <main class="main-content">
      <!-- المنيو (يمين) -->
      <section class="menu-panel" id="menu-panel">
        <div class="action-bar" id="top-bar">
          <button class="top-btn" id="btn-tables">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>الطاولات</span>
          </button>
          <button class="top-btn top-btn-danger" id="btn-clear-order">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            <span>مسح</span>
          </button>
          <button class="top-btn" id="btn-print">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span>طباعة</span>
          </button>
          <button class="top-btn" id="btn-expenses">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg>
            <span>المصروفات</span>
          </button>
          <button class="top-btn" id="btn-drawer-balance">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            <span>رصيد الدرج</span>
          </button>
          <button class="top-btn" id="btn-more">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
            <span>المزيد</span>
          </button>
        </div>
        <div class="category-tabs" id="category-tabs"></div>
        <div class="menu-grid" id="menu-grid"></div>
      </section>

      <!-- السلة (يسار) -->
      <aside class="order-panel" id="order-panel">
        <div class="order-header">
          <h2 class="table-title" id="table-title">
            <span class="table-title-placeholder">لم يتم اختيار طاولة</span>
          </h2>
        </div>
        <div class="order-divider"></div>
        <div class="order-items" id="order-items"></div>
        <div class="order-summary" id="order-summary">
          <div class="summary-row">
            <span class="summary-label">المجموع الفرعي</span>
            <span class="summary-value" id="subtotal">0.00 <small>ر.س</small></span>
          </div>
          <div class="summary-row discount-row">
            <span class="summary-label">الخصم</span>
            <input type="number" class="discount-input" id="discount-input" placeholder="0" min="0" step="0.5">
          </div>
          <div class="total-row">
            <span class="total-label">الإجمالي</span>
            <span class="total-value" id="total-value">0.00 <small>ر.س</small></span>
          </div>
          <button class="checkout-btn" id="btn-checkout">
            <span>المتابعة للدفع</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </aside>
    </main>
  </div>

  <!-- النوافذ المنبثقة (سيتم حقن الباقي تلقائياً من app.js) -->
  <div class="modal-overlay" id="tables-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>اختر طاولة</h2>
        <button class="modal-close" id="close-tables">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="tables-grid" id="tables-grid"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden><span id="toast-message"></span></div>

  <!-- فاتورة الطباعة -->
  <div id="invoice-print" style="display:none;">
    <div class="inv-table-badge"><span class="inv-table-num" id="print-table-num">—</span></div>
    <div class="inv-meta-row"><span id="print-date-time">—</span></div>
    <div class="inv-divider"></div>
    <table class="inv-table">
      <thead><tr><th>Qty</th><th>Item</th><th>Price</th></tr></thead>
      <tbody id="print-invoice-items"></tbody>
    </table>
    <div class="inv-divider"></div>
    <div class="inv-grand-total"><span>Total</span><span id="invoice-total">0.00</span></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
