<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENUX POS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="app" class="main-content">
        <!-- MENU PANEL (يسار الشاشة الآن) -->
        <div class="menu-panel">
            <div class="action-bar">
                <button class="top-btn" id="btn-tables">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span data-i18n="tables">الطاولات</span>
                </button>
                <button class="top-btn" id="btn-more">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    <span data-i18n="more">المزيد</span>
                </button>
            </div>
            <div class="category-tabs" id="category-tabs"></div>
            <div class="menu-grid" id="menu-grid"></div>
        </div>

        <!-- ORDER PANEL (يمين الشاشة الآن) -->
        <div class="order-panel">
            <div class="order-header">
                <div class="table-title" id="table-title"></div>
            </div>
            <div class="order-items" id="order-items"></div>
            <div class="order-summary">
                <div class="summary-row">
                    <span class="summary-label" data-i18n="subtotal">المجموع الفرعي</span>
                    <span class="summary-value" id="subtotal">0.00 <small data-i18n="currency">ر.س</small></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label" data-i18n="discount">الخصم</span>
                    <input type="number" class="discount-input" id="discount-input" placeholder="0" min="0">
                </div>
                <div class="total-row">
                    <span class="total-label" data-i18n="total">الإجمالي</span>
                    <span class="total-value" id="total-value">0.00 <small data-i18n="currency">ر.س</small></span>
                </div>
                <button class="checkout-btn" id="btn-checkout">دفع الآن</button>
                <button class="top-btn top-btn-danger" id="btn-clear-order" style="margin-top: 8px; justify-content: center;">مسح الطلب</button>
                <button class="top-btn" id="btn-print" style="margin-top: 4px; justify-content: center;">طباعة الفاتورة</button>
            </div>
        </div>
    </div>

    <!-- TABLES MODAL -->
    <div class="modal-overlay" id="tables-modal" hidden>
        <div class="modal" style="max-width: 800px;">
            <div class="modal-header">
                <h2 data-i18n="select-table">اختر طاولة</h2>
                <button class="modal-close" id="close-tables">✕</button>
            </div>
            <div class="table-legend">
                <div class="legend-item"><span class="legend-dot legend-empty"></span> <span data-i18n="status-empty">فارغة</span></div>
                <div class="legend-item"><span class="legend-dot legend-open"></span> <span data-i18n="status-open">مفتوحة</span></div>
                <div class="legend-item"><span class="legend-dot legend-printed"></span> <span data-i18n="status-printed">مطبوعة</span></div>
            </div>
            <div class="tables-grid" id="tables-grid"></div>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div class="modal-overlay" id="payment-modal" hidden>
        <div class="modal payment-modal-box">
            <h2>ادفع المبلغ</h2>
            <div class="payment-total" id="payment-total-amount">0.00</div>
            <div class="payment-options-grid">
                <button class="payment-option-card" data-method="cash">💵 <span data-i18n="cash">نقدي</span></button>
                <button class="payment-option-card" data-method="wallet">📱 <span data-i18n="wallet">محفظة</span></button>
                <button class="payment-option-card" data-method="credit">💳 <span data-i18n="credit-pay">آجل</span></button>
            </div>
            <button class="modal-cancel-btn" id="close-payment-modal">إلغاء</button>
        </div>
    </div>
    
    <!-- DYNAMIC UI INJECTION CONTAINER -->
    <div id="dynamic-ui-container"></div>

    <!-- TOAST -->
    <div class="toast" id="toast" hidden><span id="toast-message"></span></div>

    <!-- PRINT INVOICE -->
    <div id="invoice-print" style="display: none; padding: 20px;">
        <h2 style="text-align: center; margin-bottom: 10px;">فاتورة ضريبية</h2>
        <p>الطاولة: <span id="print-table-num"></span></p>
        <p>التاريخ: <span id="print-date-time"></span></p>
        <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 1px solid #000;">
                    <th style="text-align: start;">الصنف</th>
                    <th>الكمية</th>
                    <th>السعر</th>
                </tr>
            </thead>
            <tbody id="print-invoice-items"></tbody>
        </table>
        <h3 style="text-align: end; margin-top: 20px;">الإجمالي: <span id="invoice-total"></span> ر.س</h3>
    </div>

    <script src="app.js"></script>
</body>
</html>
